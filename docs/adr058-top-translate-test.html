<!doctype html>
<html>
<head>
  <title>ADR-058: top:50% + translateY(-50%)</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 14px;
           color: #333; }
    .row { margin: 20px; }
    .label { color: #666; margin-bottom: 8px; }
    .container { position: relative;
                 width: 200px; height: 42px;
                 background: #ecf0f1; border: 1px solid #bdc3c7; }
    .icon { position: absolute; left: 8px;
            width: 20px; height: 20px; background: #e74c3c; }
    .top-only { top: 50%; }
    .translate-only { top: 0; transform: translateY(-50%); }
    .centered { top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div class="row">
    <div class="label">Row 1: control (no top/translate) -- icon at container top</div>
    <div class="container"><div class="icon"></div></div>
  </div>

  <div class="row">
    <div class="label">Row 2: top:50% only -- icon at y=21 (half container, wrong)</div>
    <div class="container"><div class="icon top-only"></div></div>
  </div>

  <div class="row">
    <div class="label">Row 3: translateY(-50%) only -- icon at y=-10 (above container)</div>
    <div class="container"><div class="icon translate-only"></div></div>
  </div>

  <div class="row">
    <div class="label">Row 4: top:50% + translateY(-50%) -- icon centered (y=11)</div>
    <div class="container"><div class="icon centered"></div></div>
  </div>
</body>
</html>
