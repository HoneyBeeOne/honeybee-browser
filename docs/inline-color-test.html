<!doctype html>
<html>
<head>
  <title>Inline Color Test</title>
  <style>
    body { margin: 20px; font-size: 16px; }
    p { margin: 8px 0; }
    .red { color: red }
    .blue { color: blue }
  </style>
</head>
<body>
  <p>Plain paragraph with <a href="#">a red link</a> inside.</p>

  <p>Text with <span class="red">red span</span> and <span class="blue">blue span</span> inside.</p>

  <p>هذه فقرة عربية تحتوي على <a href="#">رابط ملوّن</a> في المنتصف.</p>
</body>
</html>
