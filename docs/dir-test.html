<!doctype html>
<html>
<head>
  <title>Dir Test</title>
  <style>
    body { margin: 20px; font-size: 16px; }
    p { margin: 8px 0; background-color: #f0f0f0; padding: 8px; }
  </style>
</head>
<body>
  <p>1. No dir on English — inherits LTR, LEFT-aligned.</p>

  <p dir="rtl">2. English text with dir=rtl — should be RIGHT-aligned.</p>

  <p dir="auto">3. مرحبا بكم في HoneyBee</p>

  <p>4. Mixed: هذا نص عربي. Rendered via Pango.</p>
</body>
</html>
