<!doctype html>
<html>
<head>
  <title>HoneyBee Demo</title>
  <style>
    body {
      background-color: #f0f0f0;
      margin: 20px;
      font-size: 16px;
      color: #333;
    }
    h1 {
      font-size: 32px;
      color: #d35400;
      margin: 0 0 16px 0;
    }
    p {
      font-size: 16px;
      margin: 8px 0;
      color: #444;
    }
    .card {
      width: 520px;
      margin: 20px auto;
      padding: 24px;
      background-color: #ffffff;
      border-width: 2px;
      border-color: #999999;
    }
    .highlight {
      background-color: #fff3cd;
      color: #856404;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>HoneyBee Browser</h1>
    <p>Version 0.1.0, first paint.</p>
    <p class="highlight">
      This paragraph has a yellow background and darker text.
    </p>
    <p>
      هذا نص عربي. الحروف متصلة عبر Pango.
    </p>
  </div>
</body>
</html>
