# ================================================================
# الملف: نسخ بيانات جِتهَب الاحتياطي
# المسار: مجلد جِتهَب ← مجلد السِّيرَات ← ملف نسخ البيانات
#
# ما هو هذا الملف؟
# هذا الملف هو أحد ملفات السِّير في جِتهَب. والسِّير هو برنامج
# يعمل تلقائياً على خوادم جِتهَب، إما في أوقات محددة، أو عند
# وقوع أحداث معينة. وصيغة الملف هي يامِل.
#
# ما وظيفته؟
# نسخ بيانات المستودع الوصفية إلى فرع منفصل. والبيانات الوصفية
# تشمل: المشاكل، وطلبات الدمج، والوسوم، والمراحل. وهذه البيانات
# ليست جزءاً من مستودع جِت، بل تعيش في واجهة جِتهَب، فلا تُنسخ
# تلقائياً عند نسخ الشيفرة.
#
# لماذا نحتاج هذا السِّير؟
# النسخة الاحتياطية للشيفرة تحمي الكود فقط. لكن المشاكل وطلبات
# الدمج تحمل تاريخ المشروع ومناقشاته وقراراته، وفقدانها يعني
# فقدان جزء مهم من ذاكرة المشروع. هذا السِّير يحمي هذه البيانات.
#
# كيف يعمل؟
# يعمل على حالتين:
#   الأولى: أسبوعياً، كل يوم جمعة الساعة الثانية صباحاً بتوقيت
#           التنسيق العالمي.
#   الثانية: يدوياً من صفحة الإجراءات على جِتهَب.
# ================================================================

name: Backup Metadata
# ↑ اسم السِّير كما يظهر في صفحة الإجراءات.


# ================================================================
# القسم: متى يعمل السِّير؟
# ================================================================

on:
  # --------------------------------------------------------------
  # المُشغِّل الأول: الجدولة الزمنية
  #
  # يسمح بتشغيل السِّير تلقائياً في أوقات محددة، بصيغة خاصة
  # تُسمى تعبير كرون. والتعبير المكتوب أدناه يُقرأ كالتالي:
  #   الدقيقة صفر، الساعة الثانية، كل يوم من الشهر، كل شهر،
  #   يوم الجمعة.
  # والنتيجة: تشغيل أسبوعي، كل يوم جمعة الساعة الثانية صباحاً
  # بتوقيت التنسيق العالمي.
  # --------------------------------------------------------------
  schedule:
    # كل يوم جمعة الساعة 2 صباحًا UTC
    - cron: '0 2 * * 5'

  # --------------------------------------------------------------
  # المُشغِّل الثاني: التشغيل اليدوي
  #
  # يسمح بتشغيل السِّير يدوياً من واجهة جِتهَب، دون انتظار
  # يوم الجمعة. ويُستخدم للاختبار، أو لإصلاح نسخة ناقصة.
  # --------------------------------------------------------------
  workflow_dispatch:


# ================================================================
# القسم: الصلاحيات
#
# هذا القسم يحدد ما يستطيع الرمز المدمج فعله. والرمز المدمج
# هو رمز يوفره جِتهَب تلقائياً لكل مهمة، لكنه محدود الصلاحيات
# افتراضياً.
#
# نحتاج صلاحية الكتابة في المحتوى، لأن السِّير يدفع فرعاً جديداً
# إلى المستودع.
# ================================================================

permissions:
  contents: write


# ================================================================
# القسم: المهام
# ================================================================

jobs:
  backup:
    name: Backup issues and PRs to backups/metadata branch

    # نوع الخادم الذي تعمل عليه المهمة. وهو أحدث إصدار من نظام
    # أوبونتو على خوادم جِتهَب.
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # الخُطوة الأولى: استنساخ المستودع
      #
      # تنزيل نسخة من المستودع من جِتهَب إلى الخادم، مع كامل
      # التاريخ. التاريخ الكامل ضروري لأن السِّير سيدفع فرعاً
      # جديداً، ويحتاج تاريخاً كاملاً لبنائه.
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # الخُطوة الثانية: تثبيت بايثون
      #
      # الأداة التي نستخدمها للنسخ مكتوبة بلغة بايثون، فنحتاج
      # إلى تثبيت بايثون أولاً.
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ==========================================================
      # الخُطوة الثالثة: تثبيت أداة النسخ
      #
      # الأداة اسمها github-backup، وهي مكتوبة بلغة بايثون،
      # وتُثبَّت عبر مدير الحزم.
      # ==========================================================
      - name: Install github-backup
        run: pip install github-backup

      # ==========================================================
      # الخُطوة الرابعة: تشغيل أداة النسخ
      #
      # الأداة تجلب المشاكل وطلبات الدمج والوسوم والمراحل من
      # واجهة جِتهَب، وتحفظها في ملفات نصية في مجلد مؤقت.
      #
      # والخيارات المستخدمة:
      #   -O: تعني أن المستهدف منظمة، وليس مستخدماً عادياً.
      #   -t: الرمز المستخدم للتوثيق.
      #   -o: مجلد المخرجات.
      #   -R: اسم المستودع المحدد.
      #   --issues: نسخ المشاكل.
      #   --pulls: نسخ طلبات الدمج.
      #   --labels: نسخ الوسوم.
      #   --milestones: نسخ المراحل.
      # ==========================================================
      - name: Run github-backup
        env:
          BACKUP_TOKEN: ${{ secrets.METADATA_BACKUP_TOKEN }}
        run: |
          mkdir -p /tmp/metadata-backup
          github-backup HoneyBeeOne \
            -O \
            -t "$BACKUP_TOKEN" \
            -o /tmp/metadata-backup \
            -R honeybee-browser \
            --issues \
            --pulls \
            --labels \
            --milestones

      # ==========================================================
      # الخُطوة الخامسة: تجهيز فرع النسخ الاحتياطي
      #
      # ننشئ فرعاً جديداً من الصفر، بلا تاريخ سابق. يُسمى هذا
      # النوع من الفروع "الفرع اليتيم". والسبب: نريد أن يحتوي
      # الفرع على البيانات الوصفية فقط، بلا شيفرة، ولا تاريخ
      # قديم. في كل تشغيل، نُنشئ الفرع من جديد، ونستبدل محتواه.
      # ==========================================================
      - name: Prepare orphan backups/metadata branch
        run: |
          git checkout --orphan backups/metadata
          git rm -rf . || true
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # ==========================================================
      # الخُطوة السادسة: إضافة ملف تعريفي للفرع
      #
      # نضيف ملفاً يشرح أن هذا الفرع مُولَّد تلقائياً، وأنه
      # لا يجب تعديله يدوياً. هذا يحمي الفرع من التعديلات
      # غير المقصودة.
      # ==========================================================
      - name: Add README to the backup branch
        run: |
          cat << 'MARKDOWN' > README.md
          # Metadata Backup

          This branch is generated automatically by the `backup-metadata` workflow.

          It contains JSON snapshots of GitHub metadata (issues, PRs, labels,
          milestones) for the HoneyBee Browser repository, produced by the
          `github-backup` tool.

          **Do not edit this branch manually.** It is force-pushed on each run.
          MARKDOWN

      # ==========================================================
      # الخُطوة السابعة: نقل البيانات إلى الفرع
      #
      # ننقل الملفات التي جمعتها الأداة من المجلد المؤقت إلى
      # الفرع المحلي. بعد هذه الخطوة، الفرع يحتوي على كل شيء
      # نريد دفعه.
      # ==========================================================
      - name: Copy backup data into the branch
        run: |
          cp -r /tmp/metadata-backup/* . || echo "No data to copy"

      # ==========================================================
      # الخُطوة الثامنة: الإيداع والدفع
      #
      # نُودع كل التغييرات، ثم ندفعها إلى فرع النسخ على جِتهَب.
      #
      # لماذا نستخدم رمزاً شخصياً هنا، بدل الرمز المدمج؟
      #
      # الرمز المدمج هو الرمز الذي يوفره جِتهَب تلقائياً لكل
      # مهمة. لكن جِتهَب يمنع الأحداث الناتجة عن دفع بالرمز
      # المدمج من تشغيل سيور أخرى. هذا سلوك مقصود، لمنع الحلقات
      # اللانهائية بين السيور.
      #
      # والنتيجة: لو دفعنا بالرمز المدمج، لن يُشغّل هذا الدفع
      # سير المزامنة، فلن يصل فرع النسخ إلى جِتلاب.
      #
      # الحل: نستخدم رمزاً شخصياً، وهو رمز ينشئه المستخدم من
      # إعدادات حسابه. وعندما يُستخدم هذا الرمز، يعامل جِتهَب
      # الدفع كأنه صادر من مستخدم حقيقي، فيُشغّل السيور الأخرى
      # بشكل طبيعي.
      #
      # طريقة التمرير: نُعيد توجيه العنوان البعيد ليحتوي على
      # الرمز نفسه. والصيغة المستخدمة تعتمد على اسم مستخدم
      # خاص يوفره جِتهَب لهذا الغرض تحديداً، وهو رمز يفهمه
      # جِتهَب كإشارة إلى أن الرمز يُستخدم للتوثيق الآلي.
      # ==========================================================
      - name: Commit and push
        env:
          BACKUP_TOKEN: ${{ secrets.METADATA_BACKUP_TOKEN }}
        run: |
          git add -A
          git commit -m "chore: metadata backup $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${BACKUP_TOKEN}@github.com/HoneyBeeOne/honeybee-browser.git
          git push --force origin backups/metadata
