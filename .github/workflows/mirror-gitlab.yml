# ================================================================
# الملف: نسخ المزامنة إلى جِتلاب
# المسار: مجلد جِتهَب ← مجلد السِّيرَات ← ملف نسخ المزامنة
#
# ما هو هذا الملف؟
# هذا الملف هو أحد ملفات السِّير في جِتهَب. والسِّير هو برنامج
# يعمل تلقائياً على خوادم جِتهَب، استجابةً لأحداث معينة، مثل
# دفع شيفرة جديدة، أو إنشاء طلب دمج. وصيغة الملف هي يامِل، وهي
# صيغة نصية بسيطة تُستخدم كثيراً في إعدادات الأنظمة.
#
# ما وظيفته؟
# نسخ المشروع كاملاً من جِتهَب إلى جِتلاب، بشكل تلقائي ومستمر.
# هذا النسخ يُنتج نسخة احتياطية حية على منصة ثانية، تحمي المشروع
# من فقدان الشيفرة أو البيانات، إذا تعذّر الوصول إلى جِتهَب لأي
# سبب، كانقطاع الخدمة، أو الحذف بالخطأ، أو تعطّل الحساب.
#
# ماذا ينسخ؟
# الشيفرة المصدرية بكل تاريخها وفروعها ووسومها. ولا ينسخ المشاكل
# وطلبات الدمج مباشرة، بل تُنسخ عبر سير آخر إلى فرع منفصل، ثم
# يُنسخ هذا الفرع بدوره إلى جِتلاب.
#
# كيف يعمل؟
# يعمل على ثلاث حالات:
#   الأولى: عند كل دفع إلى الفرع الرئيسي.
#   الثانية: عند كل دفع إلى فرع النسخ الاحتياطي للبيانات.
#   الثالثة: يدوياً من صفحة الإجراءات على جِتهَب.
# ================================================================

name: Mirror to GitLab
# ↑ اسم السِّير كما يظهر في صفحة الإجراءات. يمكن أن يكون أي نص،
#   لكن يُفضّل أن يكون واضحاً ومختصراً. يُستخدم كمرجع بشري
#   للتعرف على السِّير بين عشرات السِّيرَات في المستودع.


# ================================================================
# القسم: متى يعمل السِّير؟
#
# المفتاح "أون" يحدد الأحداث التي تُشغّل السِّير. وأي حدث لا يظهر
# هنا لا يُشغّل السِّير، حتى لو كان مهمّاً.
# ================================================================

on:
  # --------------------------------------------------------------
  # المُشغِّل الأول: الدفع
  #
  # أي دفع إلى فرع من الفروع المذكورة أدناه يُشغّل السِّير
  # تلقائياً. والدفع هو العملية التي تُرسل بها الإيداعات الجديدة
  # إلى المستودع البعيد على جِتهَب.
  # --------------------------------------------------------------
  push:
    # ------------------------------------------------------------
    # الفروع المُراقَبة:
    #
    # الفرع الرئيسي: كل طلب دمج يُدمج فيه يُنتج دفعاً جديداً،
    # فيُشغّل السِّير. والنتيجة أن كل تغيير على الفرع الرئيسي
    # يُنسخ فوراً إلى جِتلاب.
    #
    # فرع النسخ الاحتياطي للبيانات: يُنشَأ هذا الفرع ويُحدَّث
    # بواسطة سير آخر مخصص لنسخ المشاكل وطلبات الدمج والوسوم.
    # بعد كل نسخة، يُدفع فرع النسخ إلى جِتهَب، فيُشغّل هذا
    # السِّير لنسخه بدوره إلى جِتلاب.
    #
    # ملاحظة: أي فرع آخر لا يُشغّل السِّير، حتى لو دُفع إليه.
    # وهذا يمنع استهلاك موارد الحوسبة على فروع التطوير المؤقتة.
    # ------------------------------------------------------------
    branches: [main, backups/metadata]

  # --------------------------------------------------------------
  # المُشغِّل الثاني: التشغيل اليدوي
  #
  # يسمح بتشغيل السِّير يدوياً من واجهة جِتهَب، دون انتظار حدث
  # تلقائي. ويُستخدم في حالات مثل:
  #   - التحقق من أن المزامنة تعمل، بعد تعديل السِّير.
  #   - إصلاح نسخة احتياطية ناقصة، بعد انقطاع سابق.
  #   - مزامنة طارئة، بعد تغيير كبير على المستودع.
  #
  # وبدون هذا السطر، لا يمكن تشغيل السِّير إلا عبر حدث تلقائي.
  # --------------------------------------------------------------
  workflow_dispatch:


# ================================================================
# القسم: المهام
#
# السِّير يتكون من مهمة واحدة أو أكثر. وكل مهمة تعمل على خادم
# منفصل، ومستقلة عن غيرها. وفي مشروعنا، لدينا مهمة واحدة فقط.
# ================================================================

jobs:
  # --------------------------------------------------------------
  # المهمة الوحيدة: النسخ
  #
  # اسم المهمة هو مُعرّف داخلي، يُستخدم في تقارير التنفيذ، وفي
  # الملفات الأخرى، إن احتجنا لربط المهام. ويمكن أن يكون أي اسم.
  # --------------------------------------------------------------
  mirror:
    # اسم المهمة كما يظهر في واجهة جِتهَب. وهو أوضح من المُعرّف
    # الداخلي، ويُقرأ من قِبل البشر.
    name: Push mirror to GitLab

    # نوع الخادم الذي تعمل عليه المهمة. والمُعرّف المكتوب يعني
    # أحدث إصدار من نظام أوبونتو، على خوادم جِتهَب. وجِتهَب يوفّر
    # هذا الخادم مجاناً للمشاريع العامة، ويُعاد إنشاؤه من الصفر
    # في كل تشغيل.
    runs-on: ubuntu-latest

    # ------------------------------------------------------------
    # الخُطوات
    #
    # كل مهمة تتكون من خُطوات متتالية. وتُنفَّذ بالترتيب من الأعلى
    # إلى الأسفل. وإذا فشلت خُطوة، تتوقف المهمة كلها، ويُبلَّغ عن
    # الفشل.
    # ------------------------------------------------------------
    steps:

      # ==========================================================
      # الخُطوة الأولى: استنساخ المستودع
      #
      # ما تفعله: تنزيل نسخة من المستودع من جِتهَب إلى الخادم.
      # وهذه أول خُطوة في أي سير، لأن باقي الخُطوات تحتاج شيفرة
      # المشروع لتعمل عليها.
      #
      # لماذا نحتاجها؟ بدون استنساخ، لا يوجد شيء ننسخه. فالخادم
      # يبدأ فارغاً، فنحتاج أولاً إلى جلب الشيفرة.
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        # ↑ هذا إجراء جاهز من جِتهَب. والإجراء هو قطعة شيفرة
        #   مسبقة الصنع، يمكن استخدامها بدل كتابة الشيفرة من
        #   الصفر. والإصدار الرابع هو الأحدث.

        with:
          # ------------------------------------------------------
          # الخيار: جلب التاريخ الكامل
          #
          # الرقم صفر يعني: جلِب كامل تاريخ المشروع، وليس آخر
          # إيداع فقط.
          #
          # افتراضياً، الإجراء يجلب آخر إيداع فقط، لتوفير الوقت
          # والمساحة. لكننا نحتاج التاريخ الكامل، لأن المزامنة
          # تنقل تاريخ المشروع بأكمله إلى جِتلاب. وبدون هذا
          # الخيار، تصل النسخة إلى جِتلاب بتاريخ مقتطع، وتفقد
          # قدرتها على العمل كنسخة احتياطية حقيقية.
          # ------------------------------------------------------
          fetch-depth: 0

      # ==========================================================
      # الخُطوة الثانية: جلب كل الفروع والوسوم
      #
      # ما تفعله: تحديث المراجع المحلية بكل ما هو موجود على
      # جِتهَب، بما في ذلك الفروع التي لم تُستنسخ في الخُطوة
      # السابقة، والوسوم التي قد تكون خارج الفرع الحالي.
      #
      # لماذا نحتاجها؟ استنساخ المستودع يجلب عادةً فرعاً واحداً
      # فقط، وهو الفرع المُشغِّل، وقد لا يجلب كل الوسوم. وهذه
      # الخُطوة تضمن أننا نملك نسخة كاملة من كل شيء قبل الدفع.
      # ==========================================================
      - name: Fetch all branches and tags
        run: |
          # الأمر المكتوب يحدّث المراجع المحلية.
          # والخيار الأول يعني: من جميع المراجع البعيدة.
          # والخيار الثاني يعني: بما في ذلك كل الوسوم.
          git fetch --all --tags

      # ==========================================================
      # الخُطوة الثالثة: تحميل مفتاح التوثيق الخاص بـ جِتلاب
      #
      # ما تفعله: تُهيّئ وكيل التوثيق على الخادم، وتحمّل فيه
      # المفتاح الخاص الذي أُنشئ خصيصاً للتوثيق مع جِتلاب.
      #
      # لماذا نحتاجها؟ جِتلاب يحتاج التحقق من هويتنا، قبل أن
      # يقبل الدفع. ويتم التحقق عبر بروتوكول آمن، باستخدام زوج
      # من المفاتيح: مفتاح عام يُخزَّن على جِتلاب، ومفتاح خاص
      # يُخزَّن سرياً هنا.
      #
      # أين المفتاح الخاص؟ مخزّن في أسرار المستودع على جِتهَب،
      # تحت الاسم المذكور أدناه. وجِتهَب يحفظه مشفّراً، ولا
      # يُظهره لأحد، حتى لنا.
      # ==========================================================
      - name: Load SSH key for GitLab
        uses: webfactory/ssh-agent@v0.9.0
        # ↑ إجراء جاهز من طرف ثالث، مهمّته تشغيل وكيل التوثيق
        #   وتحميل المفتاح فيه. وهذا الإجراء موثوق ومعروف في
        #   مجتمع البرمجيات المفتوحة.
        with:
          # الإشارة إلى السِّر المحفوظ في المستودع. والنص المكتوب
          # يعني: قيمة السِّر المسمى بالاسم الظاهر. وجِتهَب
          # يستبدل هذا النص بقيمة السِّر الفعلية عند التنفيذ،
          # ولا يُظهرها في السجلات.
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      # ==========================================================
      # الخُطوة الرابعة: إضافة جِتلاب إلى قائمة المضيفين الموثوقين
      #
      # ما تفعله: تجلب المفتاح العام لخادم جِتلاب، وتضيفه إلى
      # ملف المضيفين المعروفين على الخادم.
      #
      # لماذا نحتاجها؟ في أول اتصال بخادم التوثيق الآمن، يسأل
      # البرنامج المستخدم: هل تثق بهذا المضيف؟ وفي السِّير، لا
      # يوجد مستخدم للرد، فيتوقف التنفيذ وينتهي بالفشل. وهذه
      # الخُطوة تحل المشكلة بإضافة المضيف مسبقاً.
      # ==========================================================
      - name: Add GitLab to known hosts
        run: |
          # إنشاء مجلد إعدادات التوثيق، إن لم يكن موجوداً.
          mkdir -p ~/.ssh
          # جلب المفتاح العام لخادم جِتلاب، وإضافته إلى ملف
          # المضيفين المعروفين. وبعد هذه الخُطوة، يصبح التوثيق
          # واثقاً بخادم جِتلاب تلقائياً.
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts

      # ==========================================================
      # الخُطوة الخامسة: دفع الفرع المُشغِّل والوسوم إلى جِتلاب
      #
      # ما تفعله: تنقل الفرع الذي فعّل السِّير إلى جِتلاب، مع
      # كل الوسوم. وهذه الخُطوة هي الهدف النهائي للسِّير.
      #
      # لماذا نستخدم اسم الفرع المُشغِّل، بدل خيار الكل؟
      #
      # خيار الكل يحاول دفع كل الفروع المحلية. لكنه يفشل أحياناً
      # مع الفروع التي أُنشئت من الصفر، مثل فرع النسخ الاحتياطي
      # للبيانات، لأن تاريخ هذه الفروع لا يتقاطع مع التاريخ
      # الموجود على جِتلاب.
      #
      # وبدلاً من ذلك، نستخدم اسم الفرع المُشغِّل مباشرة:
      #   إذا كان المُشغِّل هو الفرع الرئيسي، يُدفع الرئيسي.
      #   إذا كان المُشغِّل هو فرع النسخ الاحتياطي، يُدفع فرع
      #     النسخ الاحتياطي.
      #
      # لماذا البادئة الموجبة؟
      #
      # العلامة الموجبة قبل اسم المرجع تعني: دفع قسري لهذا
      # المرجع المحدد. ونحتاجها لأن فرع النسخ الاحتياطي للبيانات
      # يُعاد إنشاء تاريخه من الصفر في كل تشغيل، فلا يتقاطع
      # تاريخه الجديد مع القديم. وبدون علامة الدفع القسري، يرفض
      # جِتلاب الدفع بعد النسخة الأولى.
      #
      # وهي آمنة على الفرع الرئيسي، لأن تاريخه خطي دائماً، إذ
      # لا يُدفع إليه إلا عبر طلبات دمج مُراجَعة، فالدفع القسري
      # لا يُغيّر شيئاً فيه.
      #
      # لماذا ندفع الوسوم بشكل منفصل؟
      #
      # الوسوم ليست فروعاً، فتأتي بأمر دفع مستقل. وبدون الأمر
      # الثاني، تبقى الوسوم محلياً ولا تصل إلى جِتلاب.
      # ==========================================================
      - name: Push triggering branch to GitLab
        run: |
          # إضافة جِتلاب كمرجع بعيد، باسم محلي للاستخدام.
          # والعنوان يستخدم بروتوكول التوثيق الآمن، وليس
          # البروتوكول العادي، لأننا نستخدم المفتاح الذي
          # حمّلناه في الخُطوة الثالثة.
          git remote add gitlab git@gitlab.com:amrmuhammad/honeybee-browser.git

          # دفع الفرع المُشغِّل إلى جِتلاب.
          # والكلمة الأولى تشير إلى الإيداع الحالي، وهو الذي
          # فحصه إجراء الاستنساخ. والبادئة التالية تعني: فرع،
          # على الجهة المستقبِلة. واسم الفرع نفسه يأتي من متغير
          # جِتهَب، الذي يُرجع اسم الفرع الذي فعّل السِّير.
          git push gitlab +HEAD:refs/heads/${{ github.ref_name }}

          # دفع كل الوسوم بشكل منفصل. والوسوم تُستخدم لتعليم
          # إصدارات معينة، ولها دور في تتبع تاريخ المشروع.
          git push gitlab --tags
