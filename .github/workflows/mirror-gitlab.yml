# ================================================================
# الملف: نسخ المزامنة إلى جِتلاب
# المسار: مجلد جِتهَب ← مجلد السِّيرَات ← ملف نسخ المزامنة
#
# ما هو هذا الملف؟
# هذا الملف هو أحد ملفات السِّير في جِتهَب. والسِّير هو برنامج
# يعمل تلقائياً على خوادم جِتهَب، استجابةً لأحداث معينة، مثل
# دفع شيفرة جديدة، أو انتهاء سير آخر. وصيغة الملف هي يامِل.
#
# ما وظيفته؟
# نسخ المشروع كاملاً من جِتهَب إلى جِتلاب، بشكل تلقائي ومستمر.
# هذا النسخ يُنتج نسخة احتياطية حية على منصة ثانية، تحمي
# المشروع من فقدان الشيفرة أو البيانات.
#
# ماذا ينسخ؟
# الشيفرة المصدرية بكل تاريخها وفروعها ووسومها، وبيانات
# المستودع الوصفية (المشاكل، طلبات الدمج، الوسوم، المراحل).
#
# كيف يعمل؟
# يعمل على أربع حالات:
#   الأولى: عند كل دفع إلى الفرع الرئيسي.
#   الثانية: عند كل دفع يدوي إلى فرع النسخ الاحتياطي.
#   الثالثة: عند انتهاء سير النسخ الاحتياطي بنجاح.
#   الرابعة: يدوياً من صفحة الإجراءات على جِتهَب.
# ================================================================

name: Mirror to GitLab
# ↑ اسم السِّير كما يظهر في صفحة الإجراءات.


# ================================================================
# القسم: متى يعمل السِّير؟
# ================================================================

on:
  # --------------------------------------------------------------
  # المُشغِّل الأول: الدفع
  #
  # أي دفع إلى فرع من الفروع المذكورة أدناه يُشغّل السِّير
  # تلقائياً. والدفع هو العملية التي تُرسل بها الإيداعات الجديدة
  # إلى المستودع البعيد على جِتهَب.
  # --------------------------------------------------------------
  push:
    # ------------------------------------------------------------
    # ملاحظة مهمة: لماذا الفرع backups/metadata في قائمة الدفع؟
    #
    # الفرع مذكور هنا لسبب واحد: الحالات اليدوية. عندما يدفع
    # المشرف بنفسه إلى هذا الفرع (مثلاً لتجربة)، فإن الدفع
    # يُشغّل السير. وهذا مفيد كاحتياطي.
    #
    # أما سير النسخ الاحتياطي الآلي، فلا يُشغّل هذا السِّير عبر
    # الدفع، لأن جِتهَب يحجب تشغيل السيور من دفع الرمز المدمج.
    # ولهذا نستخدم حدث workflow_run (المُشغِّل الثالث أدناه).
    #
    # النتيجة: لا يحدث تكرار. النسخ الآلي يُشغّل السير مرة واحدة
    # عبر workflow_run. والدفع اليدوي يُشغّله مرة واحدة عبر push.
    #
    # الفروع المُراقَبة:
    #
    # الفرع الرئيسي: كل طلب دمج يُدمج فيه يُنتج دفعاً جديداً،
    # فيُشغّل السِّير، ويُنسخ التغيير فوراً إلى جِتلاب.
    #
    # فرع النسخ الاحتياطي للبيانات: يُنشَأ هذا الفرع ويُحدَّث
    # بواسطة سير آخر مخصص لنسخ المشاكل وطلبات الدمج والوسوم.
    # بعد كل نسخة، يُدفع فرع النسخ إلى جِتهَب بالرمز المدمج،
    # فلا يُشغّل هذا السِّير. أما الدفع اليدوي فيُشغّله.
    # ------------------------------------------------------------
    branches: [main, backups/metadata]

  # --------------------------------------------------------------
  # المُشغِّل الثاني: التشغيل اليدوي
  #
  # يسمح بتشغيل السِّير يدوياً من واجهة جِتهَب، دون انتظار حدث
  # تلقائي. ويُستخدم في حالات مثل:
  #   - التحقق من أن المزامنة تعمل، بعد تعديل السِّير.
  #   - إصلاح نسخة احتياطية ناقصة، بعد انقطاع سابق.
  #   - مزامنة طارئة، بعد تغيير كبير على المستودع.
  # --------------------------------------------------------------
  workflow_dispatch:

  # --------------------------------------------------------------
  # المُشغِّل الثالث: انتهاء سير النسخ الاحتياطي
  #
  # يسمح بتشغيل هذا السِّير تلقائياً عند انتهاء سير النسخ
  # الاحتياطي. وهذا هو الحل الرسمي لربط سير بسير آخر.
  #
  # لماذا نحتاجه؟
  # جِتهَب يحجب تشغيل السيور من داخل سيور أخرى، حتى لو
  # استخدمنا رمزاً شخصياً. لهذا لا يمكن الاعتماد على سلوك
  # الدفع التلقائي. وworkflow_run هو الحدث الوحيد الذي
  # صُمِّم خصيصاً لهذه الحالة.
  #
  # القيمة المطلوبة في الخانة الأولى هي اسم سير النسخ
  # الاحتياطي كما هو مكتوب في ملفه. والقيمة "completed"
  # تعني أن السير يعمل بعد انتهاء السير الأول، بغض النظر
  # عن نتيجة الانتهاء (نجاح أو فشل).
  #
  # ملاحظة مهمة: هذا السِّير يعمل بسياق الفرع الرئيسي دائماً،
  # حتى لو كان السير الأول قد عمل على فرع آخر. وهذا إجراء
  # أمني من جِتهَب لمنع تنفيذ شيفرة من فروع غير موثوقة.
  # --------------------------------------------------------------
  workflow_run:
    workflows: ["Backup Metadata"]
    types:
      - completed


# ================================================================
# القسم: المهام
#
# السِّير يتكون من مهمة واحدة أو أكثر. وكل مهمة تعمل على خادم
# منفصل، ومستقلة عن غيرها.
# ================================================================

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # الخُطوة الأولى: استنساخ المستودع
      #
      # تنزيل نسخة من المستودع من جِتهَب إلى الخادم، مع كامل
      # التاريخ. التاريخ الكامل ضروري لأن المزامنة تنقل تاريخ
      # المشروع بأكمله، وليس آخر إيداع فقط.
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # الخُطوة الثانية: جلب كل الفروع والوسوم
      #
      # تحديث المراجع المحلية بكل ما هو موجود على جِتهَب، بما
      # في ذلك الفروع التي لم تُستنسخ في الخُطوة السابقة،
      # والوسوم التي قد تكون خارج الفرع الحالي.
      # ==========================================================
      - name: Fetch all branches and tags
        run: |
          git fetch --all --tags

      # ==========================================================
      # الخُطوة الثالثة: تحميل مفتاح التوثيق الخاص بـ جِتلاب
      #
      # المفتاح مخزّن في أسرار المستودع على جِتهَب، باسم
      # GITLAB_SSH_KEY. ويُستخدم لتوثيق الدفع إلى جِتلاب دون
      # الحاجة إلى كلمة مرور.
      # ==========================================================
      - name: Load SSH key for GitLab
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      # ==========================================================
      # الخُطوة الرابعة: إضافة جِتلاب إلى المضيفين الموثوقين
      #
      # بدون هذه الخُطوة، يسأل إس إس إتش تفاعلياً هل يثق
      # بالمضيف، وهذا يوقف السِّير لعدم وجود مستخدم يرد.
      # ==========================================================
      - name: Add GitLab to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts

      # ==========================================================
      # الخُطوة الخامسة: تحديد الفرع المستهدف
      #
      # الفرع المستهدف يعتمد على نوع الحدث الذي فعّل السِّير:
      #
      #   - إذا كان الحدث دفعاً، نُزامن الفرع المُشغِّل نفسه.
      #     مثال: دفع إلى الفرع الرئيسي، نُزامن الرئيسي.
      #
      #   - إذا كان الحدث انتهاء سير النسخ الاحتياطي، نُزامن
      #     فرع النسخ الاحتياطي صراحة. والسبب أن سياق حدث
      #     workflow_run يشير إلى الفرع الرئيسي، لا إلى فرع
      #     النسخ. فهذه الخُطوة تُصحّح هذا الانحراف.
      #
      # المخرجات:
      #   - source: المرجع المحلي الذي نريد دفعه.
      #   - branch: اسم الفرع على جِتلاب.
      # ==========================================================
      - name: Determine target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "source=refs/remotes/origin/backups/metadata" >> $GITHUB_OUTPUT
            echo "branch=backups/metadata" >> $GITHUB_OUTPUT
          else
            echo "source=HEAD" >> $GITHUB_OUTPUT
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # ==========================================================
      # الخُطوة السادسة: دفع الفرع والوسوم إلى جِتلاب
      #
      # البادئة الموجبة تعني دفعاً قسرياً للمرجع المحدد فقط.
      # وهي ضرورية لفرع النسخ الاحتياطي، لأن تاريخه يُعاد
      # كتابته من الصفر في كل نسخة.
      #
      # الوسوم تُدفع بشكل منفصل، لأنها ليست فروعاً.
      # ==========================================================
      - name: Push triggering branch to GitLab
        run: |
          git remote add gitlab git@gitlab.com:amrmuhammad/honeybee-browser.git
          git push gitlab +${{ steps.target.outputs.source }}:refs/heads/${{ steps.target.outputs.branch }}
          git push gitlab --tags
